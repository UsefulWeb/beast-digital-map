server {
  listen 8080;
  server_name localhost;

  root /var/www/html;
  index index.html;

  location = /beast-digital-map {
    return 301 /beast-digital-map/;
  }

  location /beast-digital-map/ {
    alias /var/www/html/;
    try_files $uri $uri/ @beast_spa;
  }

  location @beast_spa {
    rewrite ^ /beast-digital-map/index.html last;
  }

  location = /beast-digital-map/index.html {
    alias /var/www/html/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
