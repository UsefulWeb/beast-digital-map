<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Beast Digital Map">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Beast">

    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- favicons — %BASE_URL% so deep routes (/map/…) don’t resolve relative to /map/ -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png">
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
    <link rel="mask-icon" href="%BASE_URL%safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#000000">

    <!-- Home-critical only; board session assets are hinted/loaded at runtime -->
    <link rel="preload" as="image" href="%BASE_URL%images/ui/page-background.avif">
    <link rel="preload" as="image" href="%BASE_URL%images/ui/logo.avif">
    <link rel="preload" as="image" href="%BASE_URL%images/ui/button-background.avif">
    <link rel="preload" as="image" href="%BASE_URL%images/ui/backbutton.avif">
    <link rel="preload" as="image" href="%BASE_URL%images/ui/backbuttonHover.avif">
    <!-- fonts injected by unplugin-inject-preload on build -->
    <!--__unplugin-inject-preload__-->

    <title>Beast Digital Map</title>
  </head>
  <body class="page">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
